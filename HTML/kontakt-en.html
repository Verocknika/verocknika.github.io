    <main class="narrow-container">
        <div class="page-intro">
            <h1>Send me a <span>message</span></h1>
            <p>Have a question? Fill in the form and I will get back to you.</p>
        </div>
        <div class="card">
            <form action="https://formspree.io/f/xeereklv" method="POST" enctype="multipart/form-data" class="modern-form">
                <div class="form-group">
                    <label for="email">Your e-mail</label>
                    <input type="email" id="email" name="email" placeholder="you@email.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" placeholder="What would you like to discuss?" required></textarea>
                </div>
                <button type="submit" class="btn primary submit-btn">Send message</button>
            </form>
        </div>
    </main>
