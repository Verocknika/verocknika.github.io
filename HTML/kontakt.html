    <main class="narrow-container">

            <p>Máte otázku? Vyplňte formulár a ja sa vám ozvem späť.</p>
        </div>
        <div class="card">
            <form action="https://formspree.io/f/xeereklv" method="POST" enctype="multipart/form-data" class="modern-form">
                <div class="form-group">
                    <label for="email">Váš e-mail</label>
                    <input type="email" id="email" name="email" placeholder="vas@email.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Správa</label>
                    <textarea id="message" name="message" rows="6" placeholder="Čo máte na mysli?" required></textarea>
                </div>
                <button type="submit" class="btn primary submit-btn">Odoslať správu</button>
            </form>
        </div>
